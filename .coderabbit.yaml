# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# =============================================================================
# Configuração do CodeRabbit (revisor automático de Pull Requests com IA)
# =============================================================================
# O que é: um serviço externo que lê cada PR aberta no GitHub e comenta
# possíveis erros, como um colega revisor. Ele só age depois que o aplicativo
# "CodeRabbit" for instalado no GitHub (passo manual do responsável).
#
# Por que este arquivo existe: sem ele o CodeRabbit comenta em inglês e não
# conhece as regras do Regime B. Aqui dizemos (1) a língua, (2) o que ignorar
# e (3) o que vigiar em cada pasta.
#
# Documentação oficial: https://docs.coderabbit.ai/reference/configuration
# Teste de experimentação aberto em 2026-11-21 (avaliação de custo-benefício).
#
# Divisão de papéis (decisão de 2026-11-21; ver seção "Revisões" do CLAUDE.md):
#   - o hook .githooks/pre-commit roda tipos e testes antes de cada commit;
#   - o Claude Code revisa a lógica de cada tarefa, localmente;
#   - o CodeRabbit revisa a PR inteira, uma vez por fase, com foco nas regras
#     do Regime B, em segurança e em dados pessoais.
# Por isso este arquivo corta tudo o que gera ruído: estilo, ferramentas que
# repetem o hook e enfeites do resumo.
#
# Esquema: continua o v2. O formato v3 (version: 3) está em prévia restrita;
# migrar quando ele sair da prévia (instruções por pasta viram arquivos em
# .coderabbit/instructions/). Referência: docs.coderabbit.ai/reference/configuration-v3
# =============================================================================

# Comentários em português do Brasil.
language: pt-BR

# Tom: o responsável é iniciante. Explicações curtas e didáticas.
tone_instructions: >-
  Escreva em português do Brasil simples e didático, para um desenvolvedor
  iniciante. Explique o porquê de cada sugestão e dê um exemplo curto.

reviews:
  # "chill" = só o que importa; "assertive" = mais comentários (mais ruído).
  profile: chill
  high_level_summary: true
  high_level_summary_instructions: >-
    Resumo curto em português do Brasil: no máximo 8 tópicos, agrupados por
    pasta, dizendo o que mudou e por quê. Sem tabelas longas.
  poem: false
  in_progress_fortune: false

  # Enfeites do comentário de "walkthrough" que não ajudam nesta equipe de
  # uma pessoa: desligados para o resumo ficar curto.
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  # Não pedir "Request changes": o revisor sugere, quem decide é o responsável.
  request_changes_workflow: false

  auto_review:
    enabled: true
    drafts: false
    # Só revisa PRs que vão para a main.
    base_branches:
      - "^main$"
    # Revisa de novo a cada push na PR, mas pausa depois de 5 commits
    # revisados (para retomar: comente "@coderabbitai review").
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5

  # O que NÃO revisar (economiza a cota e evita ruído).
  path_filters:
    - "!.obsidian/**"
    - "!**/*.png"
    - "!**/*.mmd"
    - "!package-lock.json"
    # Cópias fiéis das fontes da revisão: não se corrige o texto de origem.
    - "!docs/01-normativos/revisao-2026/**"
    # Minutas transcritas do SEI: são a fonte, não o produto.
    - "!docs/01-normativos/Minuta_*.md"
    - "!docs/01-normativos/*Decreto*.md"
    # Pastas de ferramentas locais.
    - "!.agents/**"
    - "!.claude/**"
    - "!.copilot/**"
    - "!.opencode/**"
    - "!copilot/**"
    # Planos, desenhos e prompts de trabalho dos agentes: são rascunhos do
    # processo, não o produto. Na PR #9 boa parte do ruído veio daqui.
    - "!docs/superpowers/**"
    - "!docs/00-memoria/prompt-*.md"
    # Arquivos gerados (caso algum dia entrem por engano numa PR).
    - "!dist/**"
    - "!playwright-report/**"
    - "!test-results/**"

  # Instruções por pasta. O CodeRabbit também lê o AGENTS.md sozinho
  # (knowledge_base.code_guidelines), mas repetimos aqui o essencial.
  path_instructions:
    - path: "**/*"
      instructions: |
        Regras invioláveis do projeto RADAR (ICMBio, Regime B):
        - Nunca usar a sigla "PGR" para Plano de Gestão de Riscos (PGR é o
          Programa de Gestão para Resultados). Aponte qualquer ocorrência.
        - "Crítico" não é nível de classificação: os níveis são Baixo, Médio,
          Alto e Extremo. "Risco Crítico" = residual fora do apetite da DAR.
        - Proibida a categoria "Operacional com interface de Integridade".
        - Nenhum dado pessoal real (nome, CPF, matrícula, e-mail de servidor)
          em código, testes ou docs; só contas de demonstração @radar.test.
          Nada vindo de _temp/ nem de arquivos .env.
        - Textos e comentários em português do Brasil, didáticos.
        Como comentar (para reduzir ruído):
        - Comente só o que pode causar erro: lógica, regra de negócio,
          segurança, dados pessoais, acessibilidade, contradição entre
          documentos. Não comente estilo, formatação, nomes, ordem de
          importações nem refatorações opcionais.
        - Tipos (vue-tsc) e testes (vitest) rodam num hook local antes de
          cada commit: não peça para rodá-los. Mas aponte erro de tipo ou de
          teste que você encontrar, sobretudo em scripts/ e
          supabase/functions/, que o vue-tsc não cobre.
        - O mesmo problema em vários lugares vira UM comentário, com a lista
          dos lugares.
        - Em dúvida se é problema, não comente.
    - path: "src/utils/calculadoraRiscoRadar.ts"
      instructions: |
        Cálculo oficial (Metodologia SEI 024421455). Verifique com rigor:
        - Risco Inerente lido da tabela fixa de 25 células do Quadro 7
          (Impacto pesa mais: P=1,I=5 -> 15; P=5,I=1 -> 11). É erro grave
          multiplicar ou somar P x I.
        - Residual = Inerente x Fator (Inexistente 1,0; Fraco 0,9;
          Mediano 0,75; Satisfatório 0,6; Forte 0,5).
        - Trava: controle sem evidência não passa de Fraco (0,9).
        - Quadro 8 sobre o valor exato, sem arredondar: Baixo 1 a 5;
          Médio >5 a 10; Alto >10 a 17; Extremo >17 a 25 (10,2 é Alto).
        Qualquer mudança aqui precisa de teste correspondente em
        tests/unit/calculadoraRiscoRadar.spec.ts.
    - path: "supabase/migrations/**"
      instructions: |
        Migrações do banco (Postgres/Supabase). Verifique: RLS ligada em toda
        tabela nova; políticas coerentes com o alcance por unidade e perfil;
        o trigger de cálculo deve seguir as mesmas regras dos Quadros 6, 7 e 8
        da calculadora em TypeScript; nunca expor a service_role; migrações
        já aplicadas não devem ser editadas (crie uma nova).
    - path: "supabase/functions/**"
      instructions: |
        Edge Functions. Nenhum segredo no código; nenhum envio de e-mail real
        a servidores do ICMBio (em desenvolvimento, só Mailpit). Trate erros
        sem vazar detalhes internos ao usuário.
    - path: "src/**/*.vue"
      instructions: |
        Vue 3 + TypeScript + gov.br DS (@govbr-ds/core). Verifique
        acessibilidade (WCAG 2.2 AA: rótulos, foco, contraste, teclado),
        uso das classes do gov.br DS (não do Bootstrap) e textos de interface
        em português claro.
    - path: "tests/**"
      instructions: |
        Testes Vitest. Aponte testes que não verificam nada de fato, dados
        pessoais reais em fixtures, e falta de casos de borda nas faixas do
        Quadro 8 (ex.: 5, 5,01, 10, 10,01, 17, 17,01).
    - path: "docs/adr/**"
      instructions: |
        ADRs no modelo de Nygard. ADR com status Accepted é imutável: só o
        campo Status pode mudar. Aponte qualquer outra edição em ADR aceito.
    - path: "docs/**/*.md"
      instructions: |
        Documentação em Obsidian (wikilinks [[...]] são válidos). Confira
        coerência de IDs (RN-NNN, RF-NNN, RNF-NNN, UC-NN, ADR-NNNN, LAC-NN),
        links quebrados e contradições com as regras do Regime B. Não sugira
        mudanças de estilo Markdown sem impacto no conteúdo.

  # Verificações automáticas da PR: o título e a descrição seguem o padrão
  # do AGENTS.md ("Fase N: <nome>"), e não usamos issues. Desligadas.
  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"

  # Ferramentas (linters) que o CodeRabbit roda por conta própria. No painel
  # web quase todas vêm ligadas; aqui ficam LIGADAS só as que acham coisas
  # que o hook de commit não acha, e DESLIGADAS as que geram ruído no nosso
  # tipo de arquivo. Ferramentas de linguagens que não usamos (Python, PHP,
  # Go, Ruby...) nem são citadas: sem arquivos delas, nunca rodam.
  tools:
    # --- LIGADAS: segurança e privacidade (o repositório é público) ---
    # Senhas e chaves vazadas (duas ferramentas, métodos diferentes).
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    # Dados pessoais (nome, CPF, e-mail) em código e documentos.
    presidio:
      enabled: true
    # Dependências do npm com vulnerabilidade conhecida.
    osvScanner:
      enabled: true
    # Migrações do Postgres perigosas (travar tabela, apagar coluna...).
    squawk:
      enabled: true
    # Dockerfile e imagem do contêiner de homologação da CGTI.
    hadolint:
      enabled: true
    trivy:
      enabled: true
    # Padrões de código inseguro em TypeScript (um só motor basta).
    semgrep:
      enabled: true
    ast-grep:
      essential_rules: true
    # --- DESLIGADAS: ruído ---
    # Estrutura e siglas dos docs já são protegidas pelo teste
    # tests/unit/documentacao.spec.ts; o LanguageTool e o Vale erram muito
    # em português técnico.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    vale:
      enabled: false
    # Estilo de SQL: só formatação, sem achar erro (as migrações são testadas
    # com "npm run test:db").
    sqlfluff:
      enabled: false
    # Linters de estilo de JavaScript sem configuração no projeto: só dão
    # palpites de formatação. O vue-tsc do hook cobre os tipos.
    biome:
      enabled: false
    oxc:
      enabled: false
    eslint:
      enabled: false
    # Repetem o semgrep.
    opengrep:
      enabled: false
    # Repetem o hadolint/trivy no Dockerfile com regras de nuvem genéricas.
    checkov:
      enabled: false
    # Reclamam da ordem das chaves do .env.example e da formatação de YAML.
    dotenvLint:
      enabled: false
    yamllint:
      enabled: false

knowledge_base:
  # Lê AGENTS.md e similares como diretrizes de código.
  code_guidelines:
    enabled: true
